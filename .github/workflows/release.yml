name: Release

# A tag v<version> builds the Windows files and opens a draft GitHub Release with them.
# A manual run, or a pull request touching the packaging, builds the same files as an artifact, without a release.
on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/package.ps1
      - scripts/third-party.mjs
      - src-tauri/tauri.conf.json
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Windows x64
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      # Actions are pinned by commit: the job builds an unsigned exe, and a moved tag must not
      # change what goes into it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Version
        id: version
        shell: pwsh
        run: |
          $v = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$v") {
            throw "Tag $env:GITHUB_REF_NAME does not match v$v in src-tauri/tauri.conf.json"
          }
          "version=$v" >> $env:GITHUB_OUTPUT

      # No caches on a tag: a release builds from a clean state only.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: ${{ github.ref_type != 'tag' && 'npm' || '' }}
          package-manager-cache: ${{ github.ref_type != 'tag' }}

      - name: Install
        run: npm ci

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: github.ref_type != 'tag'
        with:
          workspaces: src-tauri

      # Third-party licenses, the UI and the core, then the NSIS installer.
      - name: Build
        run: npx tauri build --ci

      - name: Package
        shell: pwsh
        run: scripts/package.ps1

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Kite-v${{ steps.version.outputs.version }}-windows-x64
          path: release/*
          if-no-files-found: error

  release:
    name: Draft release
    # A pushed tag only: a manual run on a tag builds the artifact and stops there.
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Kite-v${{ needs.build.outputs.version }}-windows-x64
          path: release

      # The notes are the CHANGELOG.md section of this version: "## v26.11 ..." up to the next "## ".
      - name: Draft
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          short="v${VERSION%.0}"
          awk -v h="## $short" 'index($0, h) == 1 && (length($0) == length(h) || substr($0, length(h) + 1, 1) == " ") { on = 1; next } /^## / { on = 0 } on' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then echo "::error::CHANGELOG.md has no section '## $short'"; exit 1; fi
          gh release create "$GITHUB_REF_NAME" release/* --draft --verify-tag --title "Kite $short" --notes-file notes.md
