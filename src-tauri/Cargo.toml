[package]
name = "kite"
version = "26.11.0"
description = "SSH and SFTP in one window"
license = "MIT"
repository = "https://github.com/ufee/Kite"
edition = "2024"
rust-version = "1.99"

[lib]
name = "kite_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-single-instance = "=2.5.5"
tauri-plugin-window-state = "=2.5.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
# Must match the versions wry uses, so the COM interfaces are the same types.
webview2-com = "0.39"
windows-core = "0.62"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
strip = true
panic = "abort"
