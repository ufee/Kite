[package]
name = "kite"
version = "26.11.0"
description = "SSH and SFTP in one window"
license = "MIT"
repository = "https://github.com/ufee/Kite"
edition = "2024"
rust-version = "1.99"

[lib]
name = "kite_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-single-instance = "=2.5.5"
tauri-plugin-window-state = "=2.5.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "net"] }
russh = { version = "=0.65.1", default-features = false, features = ["ring", "flate2", "rsa"] }
russh-sftp = "=3.0.1"
futures = "0.3"
zeroize = { version = "1.9.1", features = ["serde"] }
data-encoding = "2"
ring = "0.17"
keyring = "4.2.0"
tauri-plugin-dialog = "=2.8.4"
trash = "=5.3.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }
# Must match the versions wry uses, so the COM interfaces are the same types.
webview2-com = "0.39"
windows-core = "0.62"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
strip = true
panic = "abort"
